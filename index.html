<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Стальной Утёс — Гримуар ведущего</title>
<meta name="description" content="Интерактивная книга-инструмент для ведущего кампании «Стальной Утёс»: лор, путь сюжета, бестиарий и стол с генераторами.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ruslan+Display&family=Vollkorn:ital,wght@0,400;0,600;0,700;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/book.css">
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>

<!-- ===== РАСКРЫТАЯ КНИГА ===== -->
<div class="book" id="book">

  <!-- КОЖАНЫЙ КОРЕШОК / ОГЛАВЛЕНИЕ -->
  <aside class="spine" id="spine">
    <div class="spine-top">
      <a class="crest" href="#" data-go="0" aria-label="На первую страницу">
        <svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke="#c79a3f" stroke-width="2.4"/>
          <circle cx="24" cy="24" r="11" stroke="#9c2b22" stroke-width="2"/>
          <path d="M24 11 L24 37 M11 24 L37 24" stroke="#ecca7c" stroke-width="2"/></svg>
        <b>Стальной Утёс</b><small>гримуар ведущего</small>
      </a>
      <button class="burger" id="burger" aria-label="Оглавление">☰</button>
    </div>

    <div class="progress" aria-label="Проведено глав">
      <div class="progress-bar"><span id="progFill"></span></div>
      <span class="progress-txt"><b id="progDone">0</b>/<span id="progAll">0</span> проведено</span>
    </div>

    <div class="toc-search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="10" cy="10" r="7" stroke="#8a7a5a" stroke-width="2"/>
        <path d="M16 16 L22 22" stroke="#8a7a5a" stroke-width="2"/></svg>
      <input type="search" id="tocSearch" placeholder="искать главу…" aria-label="Поиск по оглавлению">
    </div>

    <nav class="toc" id="toc" aria-label="Оглавление"><!-- заполняет book.js --></nav>

    <div class="spine-foot">том · издание ведущего · <span id="yr"></span></div>
  </aside>

  <!-- ПЕРГАМЕНТНАЯ СТРАНИЦА -->
  <main class="leaf" id="leaf">
    <div class="leaf-edge left" aria-hidden="true"></div>
    <div class="leaf-edge right" aria-hidden="true"></div>

    <article class="page" id="page"><!-- заполняет book.js --></article>

    <div class="page-nav">
      <button class="pn prev" id="pnPrev" aria-label="Предыдущая глава">‹ листать</button>
      <span class="pn-hint">← / → листают страницы</span>
      <button class="pn next" id="pnNext" aria-label="Следующая глава">листать ›</button>
    </div>
  </main>
</div>

<!-- ===== КОСТЬ НА СТОЛЕ (зачаток Стола ведущего) ===== -->
<div class="dice-dock" id="diceDock">
  <div class="dice-log" id="diceLog" aria-live="polite"></div>
  <button class="dice" id="diceBtn" aria-label="Бросить d20">
    <span class="dice-face" id="diceFace">d20</span>
  </button>
  <span class="dice-cap">кость ведущего</span>
</div>

<script src="assets/js/book.js"></script>
<script src="assets/js/dice.js"></script>
</body>
</html>
